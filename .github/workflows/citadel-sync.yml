name: Citadel Sync

on:
  schedule:
    - cron: '20 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout site
        uses: actions/checkout@v4.2.2
        with:
          path: site

      - name: Checkout citadel
        uses: actions/checkout@v4.2.2
        with:
          repository: Deadlocks-Co/the-citadel
          token: ${{ secrets.CITADEL_PAT }}
          path: citadel

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Citadel sync
        run: python site/scripts/citadel_sync.py
        env:
          CITADEL_ROOT: ${{ github.workspace }}/citadel
          SITE_ROOT: ${{ github.workspace }}/site

      - name: Pull latest before committing
        run: git -C site pull --rebase --autostash origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: site
          commit_message: 'content(citadel-sync): auto-publish new articles from The Citadel'
          file_pattern: 'content/notes/** content/citadel-manifest.json'
