name: Shredder Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Run Shredder sync
        run: python scripts/shredder_sync.py
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'content(shredder): auto-sync new posts from Drive'
          file_pattern: 'content/feed.ts content/shredder-manifest.json public/shredder/**'
